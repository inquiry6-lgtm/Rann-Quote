<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8F0E46">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Rann Utsav Tent City — Quotation Generator access notice.">
<title>Rann Utsav Tent City — Quotation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E7;
    --paper:#FEFAF3;
    --maroon:#C4145F;
    --maroon-2:#8F0E46;
    --gold:#E8A23B;
    --gold-soft:#F3C878;
    --ink-soft:#5A4C40;
    --radius-lg:16px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
  }
  body{
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 50% 0%, var(--gold-soft) 0%, transparent 45%),
      var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:6vw 5vw;
  }
  .ann-card{
    width:100%;
    max-width:560px;
    background:var(--paper);
    border:1.5px solid var(--gold);
    border-radius:var(--radius-lg);
    box-shadow:0 18px 50px rgba(43,33,28,0.16);
    padding:clamp(28px,5vw,56px) clamp(22px,6vw,52px);
    text-align:center;
  }
  .ann-eyebrow{
    font-family:'IBM Plex Mono',monospace, monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--maroon);
    margin:0 0 14px;
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:700;
    color:var(--maroon-2);
    font-size:clamp(24px,4.2vw,34px);
    line-height:1.25;
    margin:0 0 18px;
  }
  p{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(17px,2.6vw,20px);
    color:var(--ink-soft);
    line-height:1.55;
    margin:0 0 30px;
  }
  .ann-divider{
    width:64px;
    height:2px;
    margin:0 auto 26px;
    background:var(--gold);
    border-radius:2px;
  }
  .ann-btn{
    display:inline-block;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.03em;
    color:var(--paper);
    background:var(--maroon-2);
    border:1.5px solid var(--gold);
    border-radius:999px;
    padding:14px 36px;
    text-decoration:none;
    transition:background .2s ease, transform .2s ease;
  }
  .ann-btn:hover{
    background:var(--maroon);
    transform:translateY(-1px);
  }
  @media (max-width:480px){
    .ann-card{ padding:32px 22px; }
  }
</style>
</head>
<body>
  <div class="ann-card" role="dialog" aria-label="Announcement">
    <p class="ann-eyebrow">Notice</p>
    <h1>This Tool Is No Longer Free</h1>
    <div class="ann-divider"></div>
    <p>The quotation generator is currently available for authorized users only.<br>To get access, please contact the owner.</p>
    <a class="ann-btn" href="mailto:ompatell.171@gmail.com?subject=Access%20Request%20%E2%80%94%20Quotation%20Generator&body=Hello%2C%20I%20would%20like%20to%20get%20access%20to%20the%20quotation%20generator.">Contact Owner</a>
  </div>
</body>
</html>
